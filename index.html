<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continue</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#101827,#263b63);
}
.card{
  width:min(92vw,420px);
  min-height:88vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  border-radius:24px;
  background:rgba(255,255,255,.08);
  box-shadow:0 18px 60px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
}
.continue-btn{
  width:100%;
  max-width:340px;
  min-height:76px;
  border:0;
  border-radius:18px;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
  font-size:30px;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(0,114,255,.35);
  transition:transform .15s ease,filter .15s ease;
}
.continue-btn:active{transform:scale(.96);filter:brightness(.9)}
</style>
</head>
<body>
  <main class="card">
    <button class="continue-btn" onclick="window.location.href='http://cv999vip.cv9998.com/?referralCode=qct1543'">
      CONTINUE
    </button>
  </main>
</body>
</html>
